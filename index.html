  @keyframes cambio { 0% { opacity: 0; } 3% { opacity: 1; }
                      20% { opacity: 1; } 23% { opacity: 0; } 100% { opacity: 0; } }
  .velo { position: absolute; inset: 0;
          background: linear-gradient(rgba(2,6,23,.30), rgba(2,6,23,.72)); }

  .lock-centro { position: relative; z-index: 2; width: 100%; max-width: 400px; padding: 18px; }
  .lock-card { background: rgba(13,20,40,.68); -webkit-backdrop-filter: blur(14px);
               backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.22);
               border-radius: 18px; padding: 34px 26px; text-align: center;
               color: #f1f5f9; box-shadow: 0 25px 60px rgba(0,0,0,.55); }
  .lock-ico { font-size: 2.6rem; line-height: 1; }
  .lock-card h1 { color: #fff; font-size: 1.45rem; margin: 12px 0 6px; }
  .lock-sub { color: #cbd5e1; font-size: .8rem; letter-spacing: .1em;
              text-transform: uppercase; margin-bottom: 24px; }
  #formClave { display: flex; flex-direction: column; gap: 10px; }
  #clave { padding: 13px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.35);
           background: rgba(255,255,255,.96); font-size: 1.05rem; text-align: center;
           letter-spacing: .18em; color: #0f172a; }
  #clave:focus { outline: 2px solid #60a5fa; }
  #btnEntrar { padding: 12px; border: 0; border-radius: 10px; background: #1d4ed8;
               color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  #btnEntrar:hover { background: #1e40af; }
  #btnEntrar:disabled { opacity: .6; cursor: wait; }
  .err { min-height: 20px; margin-top: 14px; font-size: .86rem; color: #fca5a5; }
  .err.info { color: #93c5fd; }
  .lock-pie { margin-top: 18px; font-size: .7rem; color: #94a3b8; letter-spacing: .06em; }
  .mal { animation: temblor .45s; }
  @keyframes temblor { 0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px); } 40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

  #app[hidden] { display: none; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; color: #f8fafc; }
  .sub { color: #cbd5e1; font-size: .85rem; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
           gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 14px;
          box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .card .n { font-size: 1.5rem; font-weight: 700; color: #1d4ed8; }
  .card .l { font-size: .75rem; color: #64748b; text-transform: uppercase; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input[type=search], select { padding: 9px 12px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: .95rem; background: #fff; }
  input[type=search] { flex: 1; min-width: 200px; }
  .tbl-wrap { background: #fff; border-radius: 10px; overflow-x: auto;
              box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th { background: #1e3a8a; color: #fff; padding: 10px 8px; text-align: left;
       cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; }
  th.num, td.num { text-align: right; }
  td { padding: 8px; border-bottom: 1px solid #eef2f7; white-space: nowrap; }
  tr:hover td { background: #f8fafc; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 20px;
           font-size: .7rem; font-weight: 600; }
  .of { background: #dbeafe; color: #1e40af; }
  .so { background: #dcfce7; color: #166534; }
  .old { background: #fee2e2; color: #991b1b; }
  .total-row td { font-weight: 700; background: #f1f5f9; }
  .hide { display: none; }
  .foot { margin-top: 14px; font-size: .78rem; color: #94a3b8; text-align: center; }
  .rank { color: #94a3b8; font-size: .8rem; }
  @media (max-width: 700px) { body { background-attachment: scroll; } }
  @media print {
    .controls, .cards { display: none; }
    body { padding: 0; color: #111; background: #fff !important;
           background-image: none !important; }
    h1 { color: #0f172a; } .sub { color: #64748b; } #candado { display: none; }
  }
</style>

<script>
/* ---------------- cifrado (esquema verificado con WSH) ---------------- */
/* ------------------------------------------------------------------
   Cifrado de contenido - Uso en navegador (ES3 compatible)
   Clave:  PBKDF2-SHA256 (passphrase -> clave de 32 bytes)
   Flujo:  HMAC-SHA256 en modo contador (keystream)
   Integ.: HMAC-SHA256 sobre salt||nonce||ct  (encrypt-then-MAC)
   No se usa crypto.subtle: asi funciona tambien en file:// y WSH.
------------------------------------------------------------------ */

var SHA256_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];

function sha256b(msg) {
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var i, t;
  var data = msg.slice(0);
  var len = data.length;
  data.push(0x80);
  while (data.length % 64 !== 56) data.push(0);
  var bits = len * 8;
  for (i = 7; i >= 0; i--) data.push(Math.floor(bits / Math.pow(2, i * 8)) % 256);

  var w = new Array(64);
  for (var off = 0; off < data.length; off += 64) {
    for (t = 0; t < 16; t++) {
      var j = off + t * 4;
      w[t] = ((data[j] << 24) | (data[j + 1] << 16) | (data[j + 2] << 8) | data[j + 3]) >>> 0;
    }
    for (t = 16; t < 64; t++) {
      var x = w[t - 15], y = w[t - 2];
      var s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
      var s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3],
        e = H[4], f = H[5], g = H[6], h = H[7];
    for (t = 0; t < 64; t++) {
      var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      var ch = (e & f) ^ ((~e) & g);
      var t1 = (h + S1 + ch + SHA256_K[t] + w[t]) >>> 0;
      var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      var mj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
    H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
    H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  var out = [];
  for (i = 0; i < 8; i++) {
    out.push((H[i] >>> 24) & 255, (H[i] >>> 16) & 255, (H[i] >>> 8) & 255, H[i] & 255);
  }
  return out;
}

function strb(s) {
  var a = [];
  for (var i = 0; i < s.length; i++) a.push(s.charCodeAt(i) & 255);
  return a;
}

function hmacb(key, msg) {
  var i;
  if (key.length > 64) key = sha256b(key);
  var k = key.slice(0);
  while (k.length < 64) k.push(0);
  var ipad = [], opad = [];
  for (i = 0; i < 64; i++) { ipad.push(k[i] ^ 0x36); opad.push(k[i] ^ 0x5c); }
  var inner = sha256b(ipad.concat(msg));
  return sha256b(opad.concat(inner));
}

function pbkdf2b(pass, salt, iters, dkLen) {
  var out = [], blocks = Math.ceil(dkLen / 32);
  for (var b = 1; b <= blocks; b++) {
    var u = hmacb(pass, salt.concat([((b >>> 24) & 255), ((b >>> 16) & 255),
                                     ((b >>> 8) & 255), (b & 255)]));
    var t = u.slice(0);
    for (var i = 1; i < iters; i++) {
      u = hmacb(pass, u);
      for (var j = 0; j < 32; j++) t[j] ^= u[j];
    }
    out = out.concat(t);
  }
  return out.slice(0, dkLen);
}

var B64C = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

function b64dec(s) {
  s = String(s).replace(/\s/g, "").replace(/=+$/, "");
  var out = [], buf = 0, bits = 0;
  for (var i = 0; i < s.length; i++) {
    var v = B64C.indexOf(s.charAt(i));
    if (v < 0) return null;
    buf = ((buf << 6) | v) & 0x3ffffff;
    bits += 6;
    if (bits >= 8) {
      bits -= 8;
      out.push((buf >> bits) & 255);
      buf &= (bits > 0) ? ((1 << bits) - 1) : 0;
    }
  }
  return out;
}

function bytestoa(b) {
  var s = "", i = 0;
  while (i < b.length) {
    var n = Math.min(8192, b.length - i);
    s += String.fromCharCode.apply(null, b.slice(i, i + n));
    i += n;
  }
  return s;
}

function iguales(a, b) {
  if (a === null || b === null || a.length !== b.length) return false;
  var d = 0;
  for (var i = 0; i < a.length; i++) d |= (a[i] ^ b[i]);
  return d === 0;
}

/* Descifra y devuelve el texto plano (ASCII), o null si la clave es mala. */
function descifrar_bloque(bl, clave) {
  if (!bl || !bl.salt || !bl.nonce || !bl.ct || !bl.tag) return null;
  var salt = b64dec(bl.salt), nonce = b64dec(bl.nonce),
      ct = b64dec(bl.ct), tag = b64dec(bl.tag);
  if (!salt || !nonce || !ct || !tag) return null;

  var dk = pbkdf2b(strb(clave), salt, bl.it, 32);
  var macKey = hmacb(dk, strb("MAC").concat(salt));
  var cabecera = strb("VUELO-BLOQUE-V1").concat(salt, nonce, ct);
  if (!iguales(hmacb(macKey, cabecera), tag)) return null;

  var out = [], n = Math.ceil(ct.length / 32);
  for (var i = 0; i < n; i++) {
    var ks = hmacb(dk, nonce.concat([
      ((i >>> 24) & 255), ((i >>> 16) & 255), ((i >>> 8) & 255), (i & 255)]));
    var base = i * 32;
    for (var j = 0; j < 32 && (base + j) < ct.length; j++) out.push(ct[base + j] ^ ks[j]);
  }
  return bytestoa(out);
}

let DATOS = null, RES = null;
let sortKey = 'TOTAL', sortDir = -1;

const fmt = v => (v === null || v === undefined) ? '-' :
  Number(v).toLocaleString('es-CO', {minimumFractionDigits:1, maximumFractionDigits:1});

function filtrar() {
  const q = document.getElementById('q').value.toUpperCase();
  const cat = document.getElementById('fcat').value;
  const est = document.getElementById('festado').value;
  return DATOS.filter(d => {
    const txt = (d.apellido_archivo + ' ' + d.nombre + ' ' + d.grado).toUpperCase();
    if (q && !txt.includes(q)) return false;
    if (cat && d.categoria !== cat) return false;
    if (est === 'old' && !d.desactualizado) return false;
    if (est === 'ok' && d.desactualizado) return false;
    return true;
  });
}

function render() {
  const filas = filtrar();
  filas.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (typeof x === 'string' || typeof y === 'string') {
      return String(x||'').localeCompare(String(y||'')) * sortDir;
    }
    return ((x||0) - (y||0)) * sortDir;
  });

  const tb = document.getElementById('tbody');
  tb.innerHTML = filas.map((d, i) => `
    <tr>
      <td class="rank">${i+1}</td>
      <td><strong>${d.apellido_archivo}</strong>${d.nombre && d.nombre !== d.apellido_archivo ? ` <span style="color:#94a3b8">(${d.nombre})</span>` : ''}</td>
      <td>${d.grado || '-'}</td>
      <td><span class="badge ${d.categoria === 'OFICIAL' ? 'of' : 'so'}">${d.categoria === 'OFICIAL' ? 'OF' : 'SO'}</span></td>
      <td>${d.mes_corte} ${d.desactualizado ? '<span class="badge old">sin movimiento</span>' : ''}</td>
      <td class="num">${fmt(d.D)}</td>
      <td class="num">${fmt(d.IFR)}</td>
      <td class="num">${fmt(d.N)}</td>
      <td class="num">${fmt(d.LVN)}</td>
      <td class="num"><strong>${fmt(d.TOTAL)}</strong></td>
    </tr>`).join('');

  const s = k => filas.reduce((t, d) => t + (d[k] || 0), 0);
  document.getElementById('nvis').textContent = filas.length;
  document.getElementById('sD').textContent = fmt(s('D'));
  document.getElementById('sIFR').textContent = fmt(s('IFR'));
  document.getElementById('sN').textContent = fmt(s('N'));
  document.getElementById('sLVN').textContent = fmt(s('LVN'));
  document.getElementById('sT').textContent = fmt(s('TOTAL'));
}

function iniciar() {
  document.getElementById('fecha').textContent = RES.fecha;

  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="n">${RES.total_personas}</div><div class="l">Pilotos</div></div>
    <div class="card"><div class="n">${RES.oficiales}</div><div class="l">Oficiales</div></div>
    <div class="card"><div class="n">${RES.suboficiales}</div><div class="l">Suboficiales</div></div>
    <div class="card"><div class="n">${fmt(RES.suma_horas)}</div><div class="l">Horas acumuladas</div></div>`;

  document.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.k;
    sortDir = (sortKey === k) ? -sortDir : (k === 'apellido_archivo' ? 1 : -1);
    sortKey = k;
    render();
  }));
  ['q','fcat','festado'].forEach(id => document.getElementById(id).addEventListener('input', render));

  document.getElementById('foot').textContent =
    RES.errores.length
      ? `Archivos con observación: ${RES.errores.map(e=>e[0]).join(', ')}`
      : 'Todos los archivos fueron procesados correctamente.';

  render();
}

/* ---------------- desbloqueo ---------------- */
function intentar(ev) {
  if (ev) ev.preventDefault();
  const entrada = document.getElementById('clave');
  const btn = document.getElementById('btnEntrar');
  const err = document.getElementById('err');
  const card = document.getElementById('lockCard');
  const clave = entrada.value.trim();
  if (!clave) {
    err.className = 'err'; err.textContent = 'Escribe la palabra clave';
    entrada.focus(); return;
  }
  btn.disabled = true; err.className = 'err info'; err.textContent = 'Verificando...';
  setTimeout(function () {
    let txt = null, obj = null;
    try { txt = descifrar_bloque(BLOQUE, clave); } catch (e) { txt = null; }
    if (txt) { try { obj = JSON.parse(txt); } catch (e) { obj = null; } }
    btn.disabled = false;
    if (!obj || !obj.datos || !obj.resumen) {
      err.className = 'err'; err.textContent = 'Palabra clave incorrecta';
      card.classList.remove('mal'); void card.offsetWidth; card.classList.add('mal');
      entrada.focus(); entrada.select();
      return;
    }
    DATOS = obj.datos;
    RES = obj.resumen;
    err.textContent = '';
    document.getElementById('candado').style.display = 'none';
    document.getElementById('app').hidden = false;
    iniciar();
  }, 60);
}

document.getElementById('formClave').addEventListener('submit', intentar);
window.addEventListener('load', function () { document.getElementById('clave').focus(); });
</script>
